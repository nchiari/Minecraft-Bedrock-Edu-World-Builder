<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Minecraft World Builder</title>
  <meta name="description" content="Create Minecraft Bedrock and Education worlds with packs, or turn a world into a reusable template.">
  <link rel="icon" type="image/png" href="assets/images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Syne:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css?v=20260919-2">
</head>
<body>
  <div class="bg-shape bg-shape-a" aria-hidden="true"></div>
  <div class="bg-shape bg-shape-b" aria-hidden="true"></div>

  <header class="hero container">
    <div class="hero-title-row">
      <img src="assets/images/icon.png" alt="" class="hero-icon">
      <h1 class="hero-title">Minecraft World Builder</h1>
    </div>
    <p class="hero-subline">
      <span id="hero-subtitle" class="hero-subtitle" data-i18n="app.subtitle"></span>
      <button id="howto-open" type="button" class="howto-link" data-i18n="help.open"></button>
    </p>

    <div class="lang-switch" role="group" aria-label="Language selector">
      <button type="button" class="lang-btn" data-lang="en">EN</button>
      <button type="button" class="lang-btn" data-lang="es">ES</button>
    </div>
  </header>

  <nav class="container tool-selector" aria-label="Tool selector" data-i18n-aria-label="tools.selectorLabel">
    <button id="compiler-tool-btn" class="tool-choice is-active" type="button" data-tool="compiler" aria-controls="compiler-workspace" aria-pressed="true">
      <span class="tool-choice-icon" aria-hidden="true">⇄</span>
      <span class="tool-choice-copy">
        <strong data-i18n="tools.compilerTitle"></strong>
        <small data-i18n="tools.compilerDescription"></small>
      </span>
    </button>

    <button id="template-tool-btn" class="tool-choice" type="button" data-tool="template" aria-controls="template-workspace" aria-pressed="false">
      <span class="tool-choice-icon" aria-hidden="true">◇</span>
      <span class="tool-choice-copy">
        <strong data-i18n="tools.templateTitle"></strong>
        <small data-i18n="tools.templateDescription"></small>
      </span>
    </button>

    <button id="inspector-tool-btn" class="tool-choice" type="button" data-tool="inspector" aria-controls="inspector-workspace" aria-pressed="false">
      <span class="tool-choice-icon" aria-hidden="true">✓</span>
      <span class="tool-choice-copy">
        <strong data-i18n="tools.inspectorTitle"></strong>
        <small data-i18n="tools.inspectorDescription"></small>
      </span>
    </button>

    <button id="experiments-tool-btn" class="tool-choice" type="button" data-tool="experiments" aria-controls="experiments-workspace" aria-pressed="false">
      <span class="tool-choice-icon" aria-hidden="true">⚗</span>
      <span class="tool-choice-copy">
        <strong data-i18n="tools.experimentsTitle"></strong>
        <small data-i18n="tools.experimentsDescription"></small>
      </span>
    </button>
  </nav>

  <main>
    <section id="compiler-workspace" class="tool-workspace" aria-labelledby="compiler-tool-btn">
      <div class="container layout">
        <section class="panel panel-input tool-form-panel" aria-labelledby="compiler-title">
      <h2 id="compiler-title" data-i18n="compiler.title"></h2>
      <p class="tool-intro" data-i18n="compiler.intro"></p>

      <div class="field">
        <label for="world-input" data-i18n="upload.worldLabel"></label>
        <div class="file-picker">
          <input id="world-input" class="file-native" type="file" accept=".mcworld,application/octet-stream">
          <button id="world-picker-btn" type="button" class="btn btn-file" data-i18n="upload.chooseWorld"></button>
          <span id="world-picker-text" class="file-picker-text" data-i18n="upload.noWorldChosen"></span>
        </div>
        <p class="field-help" data-i18n="upload.worldHelp"></p>
        <p id="world-file-info" class="field-file" hidden></p>
      </div>

      <div class="pack-folder-separator upload-section-separator" data-i18n="upload.packsSectionLabel"></div>

      <div class="field">
        <label for="packs-input" data-i18n="upload.packsLabel"></label>
        <div class="file-picker">
          <input id="packs-input" class="file-native" type="file" multiple accept=".mcpack,.mcaddon,application/octet-stream">
          <button id="packs-picker-btn" type="button" class="btn btn-file" data-i18n="upload.choosePacks"></button>
          <span id="packs-picker-text" class="file-picker-text" data-i18n="upload.noPacksChosen"></span>
        </div>
        <p class="field-help" data-i18n="upload.packsHelp"></p>
        <p id="packs-file-info" class="field-file" hidden></p>
      </div>

      <div class="pack-folder-separator upload-section-separator" data-i18n="upload.packFoldersSeparatorLabel"></div>

      <div class="field">
        <label for="packs-folder-input" data-i18n="upload.packFoldersLabel"></label>
        <div class="pack-folder-choices">
          <div class="pack-folder-choice">
            <span class="pack-folder-choice-label" data-i18n="upload.combinedPackFolderLabel"></span>
            <div class="file-picker">
              <input id="packs-folder-input" class="file-native" type="file" webkitdirectory multiple>
              <button id="packs-folder-picker-btn" type="button" class="btn btn-file" data-i18n="upload.choosePackFolder"></button>
              <span id="packs-folder-picker-text" class="file-picker-text" data-i18n="upload.noPackFoldersChosen"></span>
            </div>
            <p id="packs-folder-info" class="field-file" hidden></p>
          </div>

          <div class="pack-folder-separator" data-i18n="upload.separatePackFoldersLabel"></div>

          <div class="pack-folder-choice">
            <label class="pack-folder-choice-label" for="behavior-folder-input" data-i18n="upload.behaviorFolderLabel"></label>
            <div class="file-picker">
              <input id="behavior-folder-input" class="file-native" type="file" webkitdirectory multiple>
              <button id="behavior-folder-picker-btn" type="button" class="btn btn-file" data-i18n="upload.chooseBehaviorFolder"></button>
              <span id="behavior-folder-picker-text" class="file-picker-text" data-i18n="upload.noBehaviorFolderChosen"></span>
            </div>
            <p id="behavior-folder-info" class="field-file" hidden></p>
          </div>

          <div class="pack-folder-choice">
            <label class="pack-folder-choice-label" for="resource-folder-input" data-i18n="upload.resourceFolderLabel"></label>
            <div class="file-picker">
              <input id="resource-folder-input" class="file-native" type="file" webkitdirectory multiple>
              <button id="resource-folder-picker-btn" type="button" class="btn btn-file" data-i18n="upload.chooseResourceFolder"></button>
              <span id="resource-folder-picker-text" class="file-picker-text" data-i18n="upload.noResourceFolderChosen"></span>
            </div>
            <p id="resource-folder-info" class="field-file" hidden></p>
          </div>
        </div>
        <p class="field-help" data-i18n="upload.packFoldersHelp"></p>
      </div>

      <div class="limits-box">
        <h3 data-i18n="limits.title"></h3>
        <p id="limits-copy"></p>
      </div>

      <div class="option-box">
        <label class="check-option" for="clean-existing-packs">
          <input id="clean-existing-packs" type="checkbox" checked>
          <span>
            <strong data-i18n="options.cleanExistingPacksLabel"></strong>
            <small data-i18n="options.cleanExistingPacksHelp"></small>
          </span>
        </label>
        <label class="check-option" for="regenerate-pack-uuids">
          <input id="regenerate-pack-uuids" type="checkbox" checked>
          <span>
            <strong data-i18n="options.regeneratePackUuidsLabel"></strong>
            <small data-i18n="options.regeneratePackUuidsHelp"></small>
          </span>
        </label>
      </div>

      <div class="actions">
        <button id="compile-btn" type="button" class="btn btn-primary" data-i18n="actions.compile"></button>
        <button id="reset-btn" type="button" class="btn btn-ghost" data-i18n="actions.reset"></button>
      </div>
        </section>

        <section class="panel panel-status" aria-labelledby="status-title">
      <h2 id="status-title" data-i18n="status.title"></h2>
      <p id="status-summary" class="status-summary" role="status" aria-live="polite"></p>
      <div id="download-box" class="download-box" hidden>
        <p id="download-note" class="download-note"></p>
        <button id="download-btn" type="button" class="btn btn-primary" data-i18n="actions.download"></button>
      </div>
      <ul id="status-log" class="status-log" aria-live="polite"></ul>
        </section>
      </div>
    </section>

    <section id="template-workspace" class="tool-workspace" aria-labelledby="template-tool-btn" hidden>
      <div class="container layout template-layout">
        <section class="panel template-panel tool-form-panel" aria-labelledby="template-title">
          <h2 id="template-title" data-i18n="template.title"></h2>
          <p class="tool-intro" data-i18n="template.intro"></p>

          <div class="field template-world-field">
            <label for="template-world-input" data-i18n="template.worldLabel"></label>
            <div class="file-picker">
              <input id="template-world-input" class="file-native" type="file" accept=".mcworld,application/octet-stream">
              <button id="template-world-picker-btn" type="button" class="btn btn-file" data-i18n="upload.chooseWorld"></button>
              <span id="template-world-picker-text" class="file-picker-text" data-i18n="upload.noWorldChosen"></span>
            </div>
            <p class="field-help" data-i18n="template.worldHelp"></p>
            <p id="template-world-info" class="field-file" hidden></p>
          </div>

          <div id="template-metadata" hidden>
            <div class="field">
              <label for="template-authors" data-i18n="template.authorsLabel"></label>
              <input id="template-authors" class="text-input" type="text" autocomplete="off" data-i18n-placeholder="template.authorsPlaceholder">
              <p class="field-help" data-i18n="template.authorsHelp"></p>
            </div>

            <div class="template-localization-heading">
              <h3 data-i18n="template.localizationTitle"></h3>
              <p data-i18n="template.localizationHelp"></p>
            </div>
            <div id="template-language-fields" class="template-language-list"></div>

            <div class="actions">
              <button id="template-create-btn" type="button" class="btn btn-primary" data-i18n="template.create" disabled></button>
              <button id="template-reset-btn" type="button" class="btn btn-ghost" data-i18n="actions.reset"></button>
            </div>
          </div>
        </section>

        <section class="panel template-analysis-panel panel-status" aria-labelledby="template-analysis-title">
          <h2 id="template-analysis-title" data-i18n="template.analysisTitle"></h2>
          <p id="template-status-summary" class="status-summary" role="status" aria-live="polite"></p>
          <div id="template-download-box" class="download-box" hidden>
            <p class="download-note" data-i18n="template.downloadReady"></p>
            <button id="template-download-btn" type="button" class="btn btn-primary" data-i18n="template.download"></button>
          </div>
          <div id="template-analysis" class="template-analysis" hidden></div>
        </section>
      </div>
    </section>

    <section id="inspector-workspace" class="tool-workspace" aria-labelledby="inspector-tool-btn" hidden>
      <div class="container layout inspector-layout">
        <section class="panel tool-form-panel" aria-labelledby="inspector-title">
          <h2 id="inspector-title" data-i18n="inspector.title"></h2>
          <p class="tool-intro" data-i18n="inspector.intro"></p>

          <div class="field">
            <label for="inspector-world-input" data-i18n="inspector.worldLabel"></label>
            <div class="file-picker">
              <input id="inspector-world-input" class="file-native" type="file" accept=".mcworld,application/octet-stream">
              <button id="inspector-world-picker-btn" type="button" class="btn btn-file" data-i18n="upload.chooseWorld"></button>
              <span id="inspector-world-picker-text" class="file-picker-text" data-i18n="upload.noWorldChosen"></span>
            </div>
            <p class="field-help" data-i18n="inspector.worldHelp"></p>
            <p id="inspector-world-info" class="field-file" hidden></p>
          </div>

          <div class="inspector-explainer">
            <h3 data-i18n="inspector.explainerTitle"></h3>
            <p data-i18n="inspector.explainerBody"></p>
          </div>

          <div id="inspector-actions" class="actions" hidden>
            <button id="inspector-repair-btn" type="button" class="btn btn-primary" data-i18n="inspector.repair" disabled></button>
            <button id="inspector-reset-btn" type="button" class="btn btn-ghost" data-i18n="actions.reset"></button>
          </div>
        </section>

        <section class="panel panel-status inspector-results-panel" aria-labelledby="inspector-results-title">
          <h2 id="inspector-results-title" data-i18n="inspector.resultsTitle"></h2>
          <p id="inspector-status-summary" class="status-summary" role="status" aria-live="polite"></p>
          <div id="inspector-download-box" class="download-box" hidden>
            <p class="download-note" data-i18n="inspector.downloadReady"></p>
            <button id="inspector-download-btn" type="button" class="btn btn-primary" data-i18n="inspector.download"></button>
          </div>
          <div id="inspector-overview" class="inspector-overview" hidden></div>
          <div id="inspector-results" class="inspector-results" hidden></div>
        </section>
      </div>
    </section>

    <section id="experiments-workspace" class="tool-workspace" aria-labelledby="experiments-tool-btn" hidden>
      <div class="container layout experiments-layout">
        <section class="panel tool-form-panel" aria-labelledby="experiments-title">
          <h2 id="experiments-title" data-i18n="experiments.title"></h2>
          <p class="tool-intro" data-i18n="experiments.intro"></p>

          <div class="field">
            <label for="experiments-world-input" data-i18n="experiments.worldLabel"></label>
            <div class="file-picker">
              <input id="experiments-world-input" class="file-native" type="file" accept=".mcworld,.zip,application/zip,application/octet-stream">
              <button id="experiments-world-picker-btn" type="button" class="btn btn-file" data-i18n="upload.chooseWorld"></button>
              <span id="experiments-world-picker-text" class="file-picker-text" data-i18n="upload.noWorldChosen"></span>
            </div>
            <p class="field-help" data-i18n="experiments.worldHelp"></p>
            <p id="experiments-world-info" class="field-file" hidden></p>
          </div>

          <div class="experiments-warning">
            <h3 data-i18n="experiments.warningTitle"></h3>
            <p data-i18n="experiments.warningBody"></p>
          </div>

          <div id="experiments-actions" class="actions" hidden>
            <button id="experiments-save-btn" type="button" class="btn btn-primary" data-i18n="experiments.save" disabled></button>
            <button id="experiments-reset-btn" type="button" class="btn btn-ghost" data-i18n="actions.reset"></button>
          </div>
        </section>

        <section class="panel panel-status experiments-results-panel" aria-labelledby="experiments-results-title">
          <h2 id="experiments-results-title" data-i18n="experiments.resultsTitle"></h2>
          <p id="experiments-status-summary" class="status-summary" role="status" aria-live="polite"></p>
          <div id="experiments-download-box" class="download-box" hidden>
            <p class="download-note" data-i18n="experiments.downloadReady"></p>
            <button id="experiments-download-btn" type="button" class="btn btn-primary" data-i18n="experiments.download"></button>
          </div>
          <div id="experiments-summary" class="experiments-summary" hidden></div>
          <div id="experiments-list" class="experiments-list" hidden></div>
        </section>
      </div>
    </section>
  </main>

  <div id="howto-modal" class="modal" hidden aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="howto-title">
    <div id="howto-overlay" class="modal-overlay"></div>
    <div class="modal-card">
      <h2 id="howto-title" data-i18n="help.title"></h2>
      <p id="howto-intro" class="modal-intro" data-i18n="help.intro"></p>
      <ol class="modal-steps">
        <li id="howto-step-1" data-i18n="help.step1"></li>
        <li id="howto-step-2" data-i18n="help.step2"></li>
        <li id="howto-step-3" data-i18n="help.step3"></li>
      </ol>
      <p id="howto-note" class="modal-note" data-i18n="help.note"></p>
      <button id="howto-close" type="button" class="btn btn-primary" data-i18n="help.close"></button>
    </div>
  </div>

  <footer class="container footer">
    <p data-i18n="footer.note"></p>
    <p class="footer-credit">
      <span data-i18n="footer.copyright"></span>
      <span class="footer-sep">|</span>
      <a href="https://github.com/nchiari" target="_blank" rel="noopener noreferrer">GitHub</a>
      <span class="footer-sep">|</span>
      <a href="https://www.linkedin.com/in/nicochiari/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
      <span class="footer-sep">|</span>
      <a id="feedback-link" href="https://tally.so/r/KYMWkX" target="_blank" rel="noopener noreferrer" data-i18n="footer.feedback"></a>
    </p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script type="module" src="assets/js/app.js?v=20260919-2"></script>
</body>
</html>
